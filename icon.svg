<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="110" fill="url(#grad)" />
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Shield / Crest Shape -->
  <path d="M256 90 L380 140 V270 C380 345 325 405 256 430 C187 405 132 345 132 270 V140 Z" fill="rgba(255,255,255,0.06)" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round" />

  <!-- Graduation Mortarboard & Book -->
  <polygon points="256,150 350,195 256,240 162,195" fill="url(#gold)" />
  <polygon points="256,250 330,215 330,265 256,305 182,265 182,215" fill="#38bdf8" />
  <path d="M350 195 V255" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" />
  <circle cx="350" cy="265" r="8" fill="#f59e0b" />

  <!-- Letter 'E' and 'A' monogram stylized in center -->
  <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">ENGLISH ACADEMY</text>
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="8">PRO</text>
</svg>
